# CI for sngnav-app — analyze + test on every PR + push to main.
# Mirrors the SNGNav root CI workflow shape.
name: CI

on:
  push:
    # ⚑ 2026-09-01. Was `[main]` alone, and that is how a pushed head reached the
    # remote with ZERO check-runs: 47f2fe77 ("a lockfile was withholding them from
    # her") matched neither `push: [main]` nor `pull_request`, so nothing ran on it
    # and nothing said so. It took a PR to find out the tree was green.
    # Measured before widening: this repo is PUBLIC, so standard-runner minutes are
    # free; only 5 of the last 72 runs were on a non-main branch; median CI is 345s.
    # The economy argument for `main`-only did not survive being measured.
    #
    # ⛑ 2026-09-20, AAE. THE SAME DEFECT FIRED AGAIN, AND THE 09-01 WIDENING IS WHY.
    # 4cb56af was pushed to `aae/lock-upgrade-plus-10` and got ZERO runs; the IDENTICAL
    # sha pushed to `fix/lock-upgrade-plus-10` ran once and passed (run 35490809642).
    # Same tree, same commit — only the ref NAME differed. The 09-01 fix enumerated the
    # prefixes that had ALREADY failed, so a prefix joins this list only after a branch
    # of that shape has already gone silently untested. The enumeration is the defect,
    # not the particular names in it.
    #
    # Measured 2026-09-20 over the REAL population of names this unit creates — 24
    # distinct refs (18 remote + 14 local, deduped), not the two that broke:
    #   - 5 of 18 remote refs uncovered (aae/, feat/ x2, push/, slice-4-...).
    #   - 8 of 14 local branch names — a MAJORITY — would get zero check-runs if pushed.
    #   - 9 distinct shapes: fix/ preserve/ aae/ hie/ feat/ reconcile/ push/ c5/ and TWO
    #     names with NO prefix at all. `slice-4-driver-state-context` is why enumeration
    #     can never finish: no prefix pattern reaches a name that has no prefix.
    #   - `backport/**`, enumerated speculatively on 09-01, matches 0 of the 24.
    #
    # So this INVERTS instead of enumerating again: every branch runs, nothing excluded.
    # A branch whose CI is noise is a loud and free problem; a branch with no CI is a
    # silent one, and this repo has now produced that silence twice.
    #
    # COST, RE-MEASURED TODAY rather than carried over from the lines above:
    #   - repo is PUBLIC and not a fork -> standard-runner minutes are free.
    #   - 89 runs in the WHOLE history (2026-04-28..2026-09-20), not "72": 84 push +
    #     5 pull_request; 76 of the 84 on main, 8 on fix/**, 0 anywhere else. That 8 is
    #     NOT evidence that little happens off main — it is the filter measuring itself,
    #     since a branch that cannot trigger can never appear in its own run history.
    #   - median run 332s over 88 completed runs. The 345s above is stale.
    #   - all 5 uncovered remote refs are ancestors of main today, so covering them adds
    #     0 runs retroactively. Forward cost is one run per push; at the observed rate
    #     that is under ~2/day. ESTIMATE, not a measurement, and marked as one.
    #   - a branch with an open PR now runs twice per push (push + pull_request).
    #     Measured small (5 PR runs in 89) and free. Left uncollapsed ON PURPOSE: a
    #     `concurrency` group is a second unproven change to this file and it can cancel
    #     an in-flight main run. Named here rather than built untested.
    #   - NOT a signing change: `release-apk` below is gated
    #     `if: github.event_name == 'workflow_dispatch'`, so no push to any branch can
    #     produce a release-signed APK. Checked before widening, not assumed.
    #
    # `main` stays LITERALLY named beside the wildcard. It is the one branch whose CI
    # loss would be unrecoverable, and its coverage must not become contingent on how
    # `**` is matched. Keeping `branches:` at all (rather than deleting the filter)
    # also keeps tag pushes non-triggering, exactly as before.
    # PROVEN today on a seat-prefixed name, by this commit's own push.
    # ⛑ UNVERIFIED: that `**` matches a no-slash branch OTHER than main. Not demonstrated
    # here, because demonstrating it would mean minting a second remote ref, and retiring
    # a remote ref is VOICE-class. Stated as unverified rather than assumed.
    branches: [main, '**']
  pull_request:
  # Manual trigger for the installable-APK job below. Deliberately NOT on every
  # push: a release-signed artifact is a thing a stranger installs on a phone,
  # so producing one is an act, not a side effect of committing.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history — the loom mutation gate reconstructs the pre-96fd023 manifest
          # guard from git (the one that ACTUALLY shipped and ACTUALLY passed a manifest
          # killing the location dot) and requires itself to REFUSE it. A shallow clone
          # cannot see that commit, so the gate correctly HALTED rather than certify what
          # it could not prove. The fix is to give it the history, never to soften the gate
          # into passing — a gate that skips when it cannot check is the anti-loom.
          fetch-depth: 0

      # MOVED DOWN 2026-08-16, on REPRODUCTION-REVIEW FINDING F5 — see below the dead-app
      # assert for where it went and why.

      # MOVED UP 2026-08-16, on adversarial-review finding 3. This used to sit BELOW the
      # dead-app assert, which was wrong the moment that assert moved up:
      # assert_manifest_perms.sh:126 runs `python3 - "$manifest"`, so BOTH it and
      # its self-test need an interpreter. Measured with python3 shimmed to 127:
      # the assert exits 127 and its self-test exits 1. Leaving setup-python
      # below them would have traded a pinned 3.12 for whatever the runner image
      # happens to ship — a quieter dependency, not a smaller one. Pinning first
      # costs seconds and is what the previous ordering actually gave us.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Loom mutation gate (a guard is not INSERTED until PROVEN to FAIL)
        run: bash tool/loom_mutation_gate.sh --self-test

      - name: Manifest guard self-test (the loom proves itself before it judges)
        run: bash tool/assert_manifest_perms.sh --self-test

      # MOVED UP 2026-08-16 . This assert used to sit AFTER the tile-pipeline
      # steps, and was skipped on BOTH of the last two runs — 31885771720 (guard
      # could not load the renderer) and 31891584985 (guard's fixture absent from
      # the checkout). Twice in a row, a tile-pipeline ENVIRONMENT problem stopped
      # the unit from learning whether the location dot and haptic channel were
      # still declared.
      #
      # ⚑ TWO CLAIMS THAT STOOD HERE WERE FALSE, and are corrected rather than
      # deleted, because both were the author's own and both were refuted by
      # measurement (adversarial-review findings 3 and 4):
      #
      #   "This one needs nothing but bash and the manifest we wrote" — FALSE.
      #   assert_manifest_perms.sh:126 shells out to python3. The interpreter is
      #   now pinned ABOVE this step so the claim's INTENT survives even though
      #   its wording did not.
      #
      #   The claim that a defect in a heavier step could NEVER AGAIN hide this blocker —
      #   over-reached. ⚑ AND THE CORRECTION ITSELF WENT STALE THE SAME DAY,
      #   caught by reproduction-review round 3: it said "TWO steps still precede this one".
      #   THREE do — actions/setup-python@v5, the loom mutation gate, and the
      #   manifest guard's own self-test. The omitted one is the ONLY
      #   network-fetching action of the three, i.e. the same failure class this
      #   ordering exists to remove. The finding-3 fix moved setup-python up and nobody
      #   re-swept the correction sitting directly above this assert. A count in
      #   an honest-bounds note is load-bearing; this one is now recomputed from
      #   the file, not remembered.
      #   If any of those three breaks, this assert is skipped exactly as before.
      #   What is true, and all that is claimed: THE TILE-PIPELINE LANE and THE
      #   SDK DOWNLOAD can no longer hide it, and the tile pipeline is what hid it
      #   twice.
      #
      # The ordering rationale that survives both corrections: this check is the
      # highest-severity and much the cheapest, so it runs before python wheels,
      # a fixture build and a worktree materialisation. Nothing is weakened —
      # every step below still runs and still blocks; only the order changed.
      # ⚑ AND THAT LAST SENTENCE WAS ALSO WRONG, reproduction-review round 3. It read
      # "android-build and release-apk already ran it early; the test job was
      # the odd one out" — true relative to the BUILD, false relative to the SDK
      # DOWNLOAD, which precedes the assert in both of those jobs. They are
      # reordered to match this one. The purpose survived regardless, because
      # `test` carries no `if:` and runs on every trigger, so the dead-app
      # answer was always obtained somewhere; what was missing was the
      # redundancy, and redundancy on this particular guard is the point.
      - name: Assert Android manifest perms + voice-channel <queries> (dead-app blocker guard)
        run: bash tool/assert_manifest_perms.sh

      # ⛑ ARMED 2026-09-24, FBR. The disclosure-parity gate was written the
      # same day and NOTHING RAN IT: zero references in this workflow and zero in
      # preflight, while its older sibling assert_manifest_perms.sh ran in all
      # three jobs. A gate nobody runs is not a gate -- the operator stays the
      # last line of defence, which is precisely what the gate was written to
      # end. Built is not armed, and the distance between them is where the
      # defect lived. Armed in all three jobs, to match the sibling exactly.
      #
      # It reds this tree today, naming raw.githubusercontent.com: the update
      # check is a fifth network egress and the privacy policy still tells her
      # four flows are all of it. THAT RED IS CORRECT. Do not disarm the gate to
      # get green -- name the flow on the page, and the gate clears itself.
      - name: Disclosure parity self-test (the loom proves itself before it judges)
        run: bash tool/assert_disclosure_parity.sh --self-test

      - name: Assert permission + EGRESS parity with the privacy policy (consent-truth gate)
        run: bash tool/assert_disclosure_parity.sh

      # ⚑ REPRODUCTION-REVIEW FINDING F5, 2026-08-16 — flutter-action MOVED HERE, from ABOVE the
      # dead-app assert. The correction note above this assert claimed the tile
      # pipeline could no longer hide it; true, and insufficient. The SDK download is
      # the heaviest and most network-fragile step in this job, it sat ABOVE the
      # assert, and IT IS NEEDED BY NOTHING ABOVE IT — the reproduction review proved the assert and
      # both preceding guards run to exit 0 with `flutter` never invoked. So a
      # flaky SDK download still rendered the dead-app blocker guard `skipped`:
      # her location dot and her haptic channel unchecked, the exact symptom this
      # change exists to remove.
      #
      # Order is now: checkout · pin python (the assert needs an interpreter) ·
      # loom mutation gate · manifest guard self-test · THE DEAD-APP ASSERT ·
      # then everything heavy. Nothing is weakened — every step below still runs
      # and still blocks. Only the order changed, and it costs nothing.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      # ⛑ 2026-09-20, AAE, on Komada-voice `d18-2:b`. THE GLANCE GATE WAS ARMED
      # NOWHERE. Re-measured from the source rather than inherited from the brief:
      # 0 of 39 crontab rows, 0 references in this file, no invoking script; the
      # only other file naming it is a Dart comment. Our own cron_liveness.log had
      # been printing `UNARMED  scripts/hie-glance-gate.py  built, no cron row / no
      # hook / no armed caller` on EVERY run -- armed, fired, correct, unread. The
      # RCA's terminus: "it did not go green for eight days; it did not run."
      #
      # ⛑ IT SITS BELOW flutter-action, AND THE FIRST DRAFT OF THIS STEP PUT IT
      # ABOVE, WITH A REASON THAT WAS FALSE. That draft said the gate "needs python3
      # and the checked-out source, and NOTHING else", and placed it with the cheap
      # source-only guards per finding F5. It does NOT. hie_glance_gate.py:74 reads
      # the Flutter SDK's material/colors.dart to resolve `Colors.blue.shade600`
      # into a hex; with that file absent it says `C3 FAIL: ... UNMEASURED, not
      # absence` and exits 1. Above flutter-action this step would have been RED on
      # every run, for a reason with nothing to do with legibility.
      #
      # The false claim was NOT caught by its author. tool/selftest-hermeticity-guard.sh
      # classified the new guard OUTSIDE-REPO because its self-test read an absolute
      # SDK path no runner checks out -- the 2026-08-11 defect's own shape. The
      # self-test now BUILDS its own palette fixture and reads no SDK at all.
      # Recorded rather than deleted, in this file's own habit: the correction is
      # the evidence that the guard below has an instrument on it.
      #
      # THE COST OF SITTING HERE, stated because F5 exists: a flaky SDK download now
      # renders this step `skipped`. That is the trade F5 warned about, and it is
      # forced -- the gate cannot resolve a shade name without the SDK. What is NOT
      # traded: the dead-app blocker guard and both self-tests still run above this,
      # untouched.
      #
      # WHY A DECLARATION LIST rather than `--sweep`: measured, not assumed. Run bare
      # against this app the gate FAILS 24 of 24 classes in the four painting lib
      # files -- main.dart 9, akita_map.dart 7, corridor_row.dart 6,
      # advisory_cards.dart 2, recomputed from the captured sweep and not
      # remembered (the first draft of this line said "20 of 20" from a miscount) --
      # and NOT ONE is a legibility failure. They are C3b "cannot read this
      # file's paint" and N/A "0 literal fills", because this app paints through
      # _severityColor(), .withValues() and Opacity(). A sweep here is a permanently
      # red build, and a permanently red build gets deleted.
      #
      # FAIL-CLOSED, NOT ADVISORY, said plainly: every declared surface must PASS and
      # the step exits non-zero on anything else, including a surface the gate merely
      # cannot measure. An advisory gate is how this unit got an instrument that was
      # green for eight days without running.
      #
      # `test` ONLY, on purpose: this reads SOURCE, which android-build and
      # release-apk compile from the same checkout, so running it there adds no
      # coverage and two more places to keep in step. `test` carries no `if:`.
      - name: Glance gate self-test (the loom proves itself before it judges)
        run: bash tool/glance_gate.sh --self-test

      - name: Glance gate (a state surface must survive the loss of colour)
        run: bash tool/glance_gate.sh

      # 2026-09-18. Every offline voice clip must still say the words its catalog
      # entry holds. The app finds a clip by those exact words, and until this
      # step nothing compared a clip's audio with them: with two catalog values
      # moved to navigation_safety_core 0.11.9's new wet-ice sentences and both
      # clips left as they were, `flutter test` and `render_offline_voice.sh
      # --check` were green, and the APK check reads only clip names. The guard
      # re-renders every clip from the catalog in a clean copy with
      # tool/render_offline_voice.sh and byte-compares each with the committed one.
      #
      # The engine is installed here, above the hermeticity step, because that
      # step runs every tool/*.sh --self-test and this guard's self-test renders.
      # A consequence, stated so nobody finds it later: until this step the
      # phoneme oracle (test/voice/offline_voice_readable_phonemes_test.dart)
      # SKIPPED in this job, "open_jtalk engine not present on this host" (run
      # 33737493473). From here on it runs.
      #
      # The clips are bytes of one engine build, printed below. A red in which
      # every clip differs is an engine change until shown otherwise.
      - name: Offline voice engine (the clip guard renders with it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          dpkg-query -W -f='${Package} ${Version}\n' open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001

      - name: Offline voice clips say their catalog words (re-render and byte-compare)
        run: |
          bash tool/offline_voice_render_guard.sh --self-test
          bash tool/offline_voice_render_guard.sh

      # The driver's screen is Japanese, and seven guards read it with REAL glyph
      # metrics: the prefecture card against the contrast floor in two faces,
      # the map's first screen at text scale 1.5 and 2.0, and the Japanese
      # visibility band that once left 「—」 alone on a line, where a long dash
      # beside Japanese text reads like the kanji 一. With the test font's
      # uniform boxes none of those defects is visible — the 秋田 marker fits,
      # the band does not wrap — so each guard asserts its face LOADED and
      # fails closed otherwise, reason "without real glyph metrics this test
      # cannot fail".
      #
      # A runner carries no Japanese face. On the first CI run this app ever
      # had (35300438549, head da281ce) all seven went red for exactly that,
      # and the test support was also seeking Roboto inside one developer's
      # $HOME. The support now discovers its faces (test/render_see/
      # render_see_env.dart); this step gives it something to discover.
      #
      # The two packages are the two the dev host already carries, chosen so a
      # runner and that host resolve the SAME files and measure the same
      # metrics — a legibility floor read against a different face is a
      # different measurement, silently. ipag.ttf is also the face the two
      # face-named suites require by name; without it they fail closed rather
      # than accept a substitute, which is correct and is NOT what we want CI
      # doing every run.
      #
      # Versions are printed, because these fonts are an INPUT to a measured
      # threshold: if a contrast or overflow result ever moves, the first
      # question is whether the face moved under it.
      #
      # Deliberately not `--no-install-recommends`-exempt and deliberately not
      # fonts-noto-cjk: Noto would also satisfy the generic Japanese search,
      # but it is a different face with different metrics from the one the
      # findings above were measured against, and the generic search would
      # then pick it up on the dev host too.
      - name: Japanese + fallback faces (seven legibility guards need real glyphs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-ipafont-gothic fonts-droid-fallback
          dpkg-query -W -f='${Package} ${Version}\n' fonts-ipafont-gothic fonts-droid-fallback
          # The discovery's tier-2 paths, asserted here rather than left to a
          # test failure: a package that moves its files would otherwise show
          # up as seven confusing legibility reds.
          for f in /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf \
                   /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf; do
            test -f "$f" || { echo "expected face missing: $f"; exit 1; }
            echo "present: $f ($(stat -c%s "$f") bytes)"
          done

      # 2026-08-11: these two steps previously resolved the guards through a path
      # inside a DIFFERENT, PRIVATE repo ($HOME/Documents/...) that a runner never
      # checks out, so both were permanent no-ops that always passed — while
      # .githooks/README.md told cloners CI covered them. Measured false by the reproduction review
      # with a clean $HOME. The guards are now vendored into tool/ beside the
      # sibling guards that actually run, and a missing guard is RED, not skipped.
      # 2026-08-15: the step below went RED the FIRST time it ever really
      # ran. That is the vendoring above working, not a regression.
      #
      # tile-pipeline-defaults-guard.sh loads tool/render_akita_mbtiles.py to
      # read the renderer's LIVE defaults. The GUARD's own header says why —
      # not the renderer's, which is how a stranger reads "its own" after
      # "the renderer's", and the renderer's line 14 carries nothing of the
      # sort. Quoted verbatim from tool/tile-pipeline-defaults-guard.sh
      # line 14, verified 2026-08-16 by: grep -n "REAL renderer code"
      # tool/ — one hit, that file, that line.
      # "It calls the REAL renderer code — not a replica of it, which would
      # drift." The renderer imports PIL at module scope
      # (render_akita_mbtiles.py:29), so on a runner without it exec_module
      # raises, the guard prints LOAD_ERROR and exits 1, and self-test case 1
      # reports `real renderer REJECTED`. That is the guard correctly refusing
      # to certify a renderer it could not load. Reproduced 2026-08-15 against a
      # deps-free venv: identical signature — 5 cases, case 1 failing. With the
      # deps present: 5/5 OK, exit 0.
      #
      # MEASURED, recorded so the next reader does not have to re-derive it:
      #   - PIL is the only module-scope import that matters. shapely is
      #     function-local (:161,:162,:531,:532,:602) and build_metadata()
      #     (:540-581) calls nothing but .get(), so shapely never loads here.
      #     We install the whole of tool/requirements.txt regardless, because
      #     that file IS the declared closure; hand-trimming it here would
      #     create a second dependency list that drifts — the exact defect
      #     requirements.txt was written to end.
      #   - The CJK fonts requirements.txt calls load-bearing are NOT needed by
      #     this step: FONT_CANDIDATES (:106) is a path list, and load_font()
      #     (:139) is called neither at import nor by build_metadata(). So no
      #     apt step. The corollary is the honest bound, and it matters more
      #     than the fix: a GREEN here does NOT verify the tile RENDER path,
      #     and specifically does not cover the silent
      #     ImageFont.load_default() fallback that ships a map a driver cannot
      #     read. This step verifies the DEFAULTS only.
      #   - osmium/pillow/shapely all resolve as cp312 manylinux wheels
      #     (verified with --only-binary=:all:), so the runner needs no build
      #     toolchain and no cache is warranted for three small wheels.
      #
      # The fix is to give CI the deps — never to skip the case, because a guard
      # that skips when it cannot check is the anti-loom this file already names
      # two comments above.
      #
      # (actions/setup-python now runs near the TOP of this job — see the note
      # there. The dead-app assert also needs python3, so pinning had to happen
      # before it. Deliberately not duplicated here.)

      # python3, not python: the guard resolves its own interpreter with
      # `command -v python3` (tile-pipeline-defaults-guard.sh:29). Installing
      # into a different interpreter would leave the guard RED with a signature
      # indistinguishable from a real default drift — the worst kind of red,
      # because it points the next reader at the shipped archive instead of at
      # the environment.
      - name: Tile-renderer deps (the guard loads the real renderer; it needs them)
        run: python3 -m pip install --disable-pip-version-check -q -r tool/requirements.txt

      - name: Tile-pipeline guards self-test (a guard is not INSERTED until PROVEN to FAIL)
        run: |
          test -x tool/tile-pipeline-defaults-guard.sh || { echo "tile guards missing from checkout"; exit 1; }
          test -x tool/tile-archive-identity-guard.sh  || { echo "tile guards missing from checkout"; exit 1; }
          bash tool/tile-pipeline-defaults-guard.sh --self-test
          bash tool/tile-archive-identity-guard.sh --self-test

      # 2026-08-16: the step above went RED at 7339570 because
      # tile-archive-identity-guard.sh's --self-test read its fixture from
      # assets/tiles/gunma_offline.mbtiles — a local build intermediate that is
      # not tracked and not ignored, so it is in no checkout a runner ever makes.
      # Those four detection cases had therefore NEVER RUN: the guard had never
      # been proven to detect anything. The fixture is now BUILT in a tmpdir
      # instead of FOUND on disk, which is the idiom the other self-tests here
      # already use.
      #
      # THIS step is the loom for the CLASS, not for that instance. Nothing
      # asserted that a guard's --self-test could run from a clean checkout —
      # the others are hermetic by accident of idiom, not because anything
      # checks. It materialises the committed tree in a throwaway worktree
      # (tracked files only, history intact) and runs every tool/*.sh
      # --self-test there, and in the live tree, so it can tell "depends on
      # something not in the repo" from "fails everywhere". Fail-closed: a
      # self-test it cannot evaluate is exit 3, never green.
      #
      # PROVEN TO FAIL before insertion, on the REAL defect, measured 2026-08-16:
      # against a 7339570 worktree with the untracked gunma_offline.mbtiles
      # restored, the OLD self-test reports "4/4 OK" exit 0 while this guard
      # reports NON-HERMETIC exit 1. It would have caught ae1bcf6 at author time.
      #
      # It runs AFTER the deps step on purpose: it executes the real self-tests,
      # and tile-pipeline-defaults-guard.sh needs PIL. Without the deps it would
      # report UNDETERMINED — honest, but a red pointing at the environment
      # rather than at hermeticity.
      # ⚑ REPRODUCTION-REVIEW ROUND 3 MEASURED THAT THIS STEP WAS LARGELY ORNAMENT IN CI, and the
      # reason is structural, not a bug: a runner checkout has ZERO
      # untracked-not-ignored paths, so PRISTINE and SEEDED are byte-identical
      # and the NON-HERMETIC and DIVERGENT verdicts are UNREACHABLE HERE. They
      # catch the defect on a DEVELOPER's machine, which is where the untracked
      # fixture lives. The OUTSIDE-REPO check added this round is the only
      # verdict in the file that can fire on a runner at all — so it is the only
      # thing standing between CI and a guard wired through a path CI does not
      # have, which is precisely the 2026-08-11 defect.
      #
      # It needs `strace`, and without it the class is UNCHECKED. Installing it
      # costs seconds; REQUIRE_TRACE=1 then makes an unchecked class a hard
      # fail-closed 3 instead of a NOTE scrolling past in a log — the reproduction review's words,
      # "UNVERIFIED that clears the gate is cleared."
      - name: Self-test hermeticity (a guard's self-test must run from a CLEAN CHECKOUT)
        env:
          SELFTEST_HERMETIC_REQUIRE_TRACE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          strace -V | head -1
          bash tool/selftest-hermeticity-guard.sh --self-test
          bash tool/selftest-hermeticity-guard.sh

      - name: Tile archive identity (every shipped .mbtiles must not lie about itself)
        run: |
          shopt -s nullglob
          archives=(assets/tiles/*.mbtiles)
          test ${#archives[@]} -gt 0 || { echo "no tile archives in checkout"; exit 1; }
          for m in "${archives[@]}"; do
            bash tool/tile-archive-identity-guard.sh "$m"
          done

      # (the dead-app blocker assert now runs near the TOP of this job — see the
      # note there. Deliberately NOT duplicated here: two copies would drift, and
      # the point of the move is that it runs before anything heavier can fail.)

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # ⚑ 2026-09-25. THE NOTIFICATION FIT GATE WAS ARMED NOWHERE.
      # tool/assert_notification_fit.sh existed from 2026-09-24, and an
      # integration check on 5b80fcb measured that no CI step and no test ran
      # it; only a comment named it. The hermeticity step above does execute its --self-test, as it
      # does every tool/*.sh, but the self-test reads fixtures. Nothing ever
      # measured the SHIPPED strings. A gate nobody runs catches nothing.
      #
      # WHY HERE, AFTER `flutter test`, measured rather than guessed. The gate
      # reads three things: Pillow (installed above from tool/requirements.txt),
      # a CJK face (DroidSansFallbackFull, installed above with the Japanese
      # faces) and Roboto from the Flutter SDK's material_fonts. After `flutter
      # test` that last one is certainly downloaded. Measured on the dev host:
      # Droid and Noto give identical widths for both body strings, which carry
      # the stop-word check, and titles within 1.2%. Without Roboto the gate
      # falls back to DejaVu, which is wider, and prints that it did.
      #
      # What it checks: title and body fit their rows at scale 1.0, and 停止 /
      # Stop survive a truncating row at text scales 1.0 to 2.0. Only 1.0 and
      # 1.3 are observed; the rest are a linear extrapolation. A pass means
      # "fits by measurement", never "seen".
      - name: Notification fit — the stop word survives every text scale
        run: |
          bash tool/assert_notification_fit.sh --self-test
          bash tool/assert_notification_fit.sh

  # Proves the APK actually builds on a clean SDK-bearing runner, independently
  # of any one machine's local toolchain. The perm-assert also gates here so a
  # manifest that lost the WS1 perms fails BEFORE a dead APK is ever produced.
  #
  # CORRECTED 2026-08-06: this comment used to read "the local dev env has no
  # Android SDK, so this build is verified in CI, not on the author's machine".
  # That is false and was measured false — the dev machine carries SDK platforms
  # 34/35/36 and build-tools 34/35/36, and release APKs have been built on it.
  # The real reason to build here is environment independence, not absence.
  # A live skew remains and is NOT fixed: this job pins Flutter 3.41.4 stable
  # while the dev machine runs 3.45.0-1.0.pre-48 (user-branch), so the two do
  # not necessarily compile the same way.
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history — the loom mutation gate reconstructs the pre-96fd023 manifest
          # guard from git (the one that ACTUALLY shipped and ACTUALLY passed a manifest
          # killing the location dot) and requires itself to REFUSE it. A shallow clone
          # cannot see that commit, so the gate correctly HALTED rather than certify what
          # it could not prove. The fix is to give it the history, never to soften the gate
          # into passing — a gate that skips when it cannot check is the anti-loom.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 2026-08-16: pin the interpreter here too. The dead-app blocker
      # assert below shells out to python3 (assert_manifest_perms.sh:126), and
      # this job had NO setup-python at all — so it ran against whatever the
      # runner image happened to ship. Not a live break on ubuntu-24.04, and not
      # a regression: it predates this change. It is listed here because the finding-3
      # reasoning that moved the pin in the `test` job applies identically to
      # this one, and leaving two of the three jobs unpinned would have made the
      # fix a local tidy rather than a repair. Found by the second adversarial
      # review, which noted these jobs were never simulated.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Loom mutation gate (a guard is not INSERTED until PROVEN to FAIL)
        run: bash tool/loom_mutation_gate.sh --self-test

      - name: Manifest guard self-test (the loom proves itself before it judges)
        run: bash tool/assert_manifest_perms.sh --self-test

      - name: Assert Android manifest perms + voice-channel <queries> (dead-app blocker guard)
        run: bash tool/assert_manifest_perms.sh

      # ⛑ ARMED 2026-09-24, FBR. The disclosure-parity gate was written the
      # same day and NOTHING RAN IT: zero references in this workflow and zero in
      # preflight, while its older sibling assert_manifest_perms.sh ran in all
      # three jobs. A gate nobody runs is not a gate -- the operator stays the
      # last line of defence, which is precisely what the gate was written to
      # end. Built is not armed, and the distance between them is where the
      # defect lived. Armed in all three jobs, to match the sibling exactly.
      #
      # It reds this tree today, naming raw.githubusercontent.com: the update
      # check is a fifth network egress and the privacy policy still tells her
      # four flows are all of it. THAT RED IS CORRECT. Do not disarm the gate to
      # get green -- name the flow on the page, and the gate clears itself.
      - name: Disclosure parity self-test (the loom proves itself before it judges)
        run: bash tool/assert_disclosure_parity.sh --self-test

      - name: Assert permission + EGRESS parity with the privacy policy (consent-truth gate)
        run: bash tool/assert_disclosure_parity.sh

      # REPRODUCTION-REVIEW ROUND 3 / F5 residual B: moved BELOW the dead-app assert, to match
      # the `test` job. The SDK download is the heaviest and most
      # network-fragile step and the assert needs nothing from it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # The offline voice opens its clips with a key Dart builds and Kotlin
      # prefixes. From 2026-07-12 to 2026-09-16 that key named a path the APK
      # did not hold: every phrase fell back to the phone's TTS, nothing was
      # logged, and every test passed against a fake player. This records the
      # keys from the engine's real channel call and checks each one against
      # the APK just built.
      - name: Offline voice clips open where Android looks for them (reads the built APK)
        run: |
          SNGNAV_BUNDLED_AUDIO_KEYS_OUT="$RUNNER_TEMP/bundled_audio_keys.txt" \
            flutter test test/voice/bundled_audio_platform_keys_test.dart
          python3 tool/check_bundled_audio_in_apk.py \
            build/app/outputs/flutter-apk/app-debug.apk \
            "$RUNNER_TEMP/bundled_audio_keys.txt"

  # ---------------------------------------------------------------------------
  # The VEHICLE. Until this job runs, nobody outside one laptop can install this
  # app: `android-build` above proves the APK compiles and then throws it away
  # with the runner, and there is no other artifact anywhere in the repo.
  #
  # It is release-SIGNED or it does not exist. An APK is what a person can
  # actually put on a phone (`adb install`, or tap it in a file manager); an
  # .aab cannot be installed at all and is not a vehicle.
  #
  # SECRETS ARE REQUIRED AND ARE NOT IN THIS REPO. The upload keystore is
  # deliberately gitignored and has never been committed. Both halves verified
  # 2026-08-16: android/.gitignore is 14 lines long and its
  # lines 12-14 are verbatim `key.properties`, `**/*.keystore`, `**/*.jks`;
  # and `git log --all -- 'android/app/upload-keystore.jks' '*.jks'
  # '*.keystore' 'android/key.properties'` returns no commits at all.
  # So this job cannot sign until the maintainer adds:
  #   ANDROID_KEYSTORE_BASE64  - base64 of android/app/upload-keystore.jks
  #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
  # Until then the job FAILS LOUDLY on the guard below. That is the intent: the
  # alternative is gradle's dev-convenience fallback quietly debug-signing an
  # artifact labelled "release", which is precisely the thing we must never hand
  # to a stranger.
  # ---------------------------------------------------------------------------
  release-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # The same gates the other jobs run. An installable artifact may not be
      # built off a tree that has not passed them.
      # 2026-08-16: pin the interpreter here too. The dead-app blocker
      # assert below shells out to python3 (assert_manifest_perms.sh:126), and
      # this job had NO setup-python at all — so it ran against whatever the
      # runner image happened to ship. Not a live break on ubuntu-24.04, and not
      # a regression: it predates this change. It is listed here because the finding-3
      # reasoning that moved the pin in the `test` job applies identically to
      # this one, and leaving two of the three jobs unpinned would have made the
      # fix a local tidy rather than a repair. Found by the second adversarial
      # review, which noted these jobs were never simulated.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Loom mutation gate (a guard is not INSERTED until PROVEN to FAIL)
        run: bash tool/loom_mutation_gate.sh --self-test

      - name: Play preflight self-test (the predicates must reject bad input)
        run: bash tool/preflight_play_upload.sh --self-test

      - name: Manifest guard self-test (the loom proves itself before it judges)
        run: bash tool/assert_manifest_perms.sh --self-test

      - name: Assert Android manifest perms + voice-channel <queries> (dead-app blocker guard)
        run: bash tool/assert_manifest_perms.sh

      # ⛑ ARMED 2026-09-24, FBR. The disclosure-parity gate was written the
      # same day and NOTHING RAN IT: zero references in this workflow and zero in
      # preflight, while its older sibling assert_manifest_perms.sh ran in all
      # three jobs. A gate nobody runs is not a gate -- the operator stays the
      # last line of defence, which is precisely what the gate was written to
      # end. Built is not armed, and the distance between them is where the
      # defect lived. Armed in all three jobs, to match the sibling exactly.
      #
      # It reds this tree today, naming raw.githubusercontent.com: the update
      # check is a fifth network egress and the privacy policy still tells her
      # four flows are all of it. THAT RED IS CORRECT. Do not disarm the gate to
      # get green -- name the flow on the page, and the gate clears itself.
      - name: Disclosure parity self-test (the loom proves itself before it judges)
        run: bash tool/assert_disclosure_parity.sh --self-test

      - name: Assert permission + EGRESS parity with the privacy policy (consent-truth gate)
        run: bash tool/assert_disclosure_parity.sh

      # REPRODUCTION-REVIEW ROUND 3 / F5 residual B: moved BELOW the dead-app assert, to match
      # the `test` job. The SDK download is the heaviest and most
      # network-fragile step and the assert needs nothing from it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      # Same guard as the `test` job (see the note there): an installable
      # artifact is not built off clips that say other words than the ones the
      # app looks them up by. The engine also makes the phoneme oracle run in
      # this job's `flutter test` instead of skipping.
      - name: Offline voice engine (the clip guard renders with it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          dpkg-query -W -f='${Package} ${Version}\n' open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001

      - name: Offline voice clips say their catalog words (re-render and byte-compare)
        run: |
          bash tool/offline_voice_render_guard.sh --self-test
          bash tool/offline_voice_render_guard.sh

      # This job runs the full suite below, so it needs the same faces as the
      # `test` job — see the long note at that job's copy of this step for WHY
      # these two packages and not another. A release artifact must not be cut
      # off a run where the seven legibility guards went red for want of a
      # font: that red is indistinguishable at a glance from the driver's screen having
      # actually regressed.
      - name: Japanese + fallback faces (seven legibility guards need real glyphs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-ipafont-gothic fonts-droid-fallback
          dpkg-query -W -f='${Package} ${Version}\n' fonts-ipafont-gothic fonts-droid-fallback
          for f in /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf \
                   /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf; do
            test -f "$f" || { echo "expected face missing: $f"; exit 1; }
            echo "present: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # No artifact off an unrun tree. Tests-green is not "verified",
      # but an unrun suite is not even green.
      - name: Test
        run: flutter test

      - name: Require signing secrets (never debug-sign a "release")
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "Refusing to build: without it, gradle falls back to DEBUG keys"
            echo "and would produce a debug-signed APK labelled 'release'."
            echo "Add the keystore secrets, or build locally where key.properties exists."
            exit 1
          fi

      - name: Restore keystore + key.properties
        env:
          KS:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPW:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS:   ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS" | base64 -d > android/app/upload-keystore.jks
          # Same four keys android/app/build.gradle.kts reads, same relative
          # storeFile path (resolved against the :app project dir).
          {
            echo "storePassword=$STOREPW"
            echo "keyPassword=$KEYPW"
            echo "keyAlias=$ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      # Same check as in android-build, on the artifact a person installs.
      - name: Offline voice clips open where Android looks for them (reads the built APK)
        run: |
          SNGNAV_BUNDLED_AUDIO_KEYS_OUT="$RUNNER_TEMP/bundled_audio_keys.txt" \
            flutter test test/voice/bundled_audio_platform_keys_test.dart
          python3 tool/check_bundled_audio_in_apk.py \
            build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/bundled_audio_keys.txt"

      # THE ARTIFACT PLAY ACTUALLY TAKES. Added 2026-08-10 .
      # This job was named "build the vehicle" and built the wrong one: new apps
      # on Google Play must be submitted as an ANDROID APP BUNDLE, so the .apk
      # above — the only thing this job produced and verified — is not uploadable.
      # It remains useful (it is the sideload fallback a tester can install
      # directly), so both are built and both are kept.
      #
      # Building the .aab HERE also removes a hazard no local gate can see: there
      # are divergent working copies of this app on the build machine, and a
      # locally-built bundle carries no proof of which one it came from. A bundle
      # built by CI is pinned to a commit by construction.
      - name: Build release App Bundle (the artifact Play accepts)
        run: flutter build appbundle --release

      # All five Play-rejection gates, against the real artifacts, before anyone
      # spends a cycle of the Oct 31 window on an upload that would bounce:
      # signature, targetSdk, 16 KB page alignment, versionCode, and permission
      # parity between the manifest we author and the app we ship.
      - name: Play upload preflight (5 gates, on the built artifacts)
        run: bash tool/preflight_play_upload.sh --skip-build

      # THE LOOM. Signing is the whole point of this job, so it is verified,
      # not assumed — and it is verified by REFUSING the debug certificate by
      # name rather than by trusting that the fallback did not fire.
      - name: Verify the APK is NOT debug-signed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is DEBUG-SIGNED. Refusing to upload."
            exit 1
          fi
          echo "Release signature confirmed."

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: sngnav-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      # The upload-ready bundle, so the maintainer can take it straight to Play
      # Console without a local build (and without choosing between two trees).
      - uses: actions/upload-artifact@v4
        with:
          name: sngnav-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
